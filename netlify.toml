[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

[[redirects]]
  from = "/api/auth/send-otp"
  to = "/.netlify/functions/auth-send-otp"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/verify-otp"
  to = "/.netlify/functions/auth-verify-otp"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
